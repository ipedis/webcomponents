<header role="banner">
  <div id="lp-content" class="head">
    <div class="back-wrapper">
      <a
        href="https://design.ipedis.com/"
        aria-label="Back to Ipedis Design system"
      >
        <img src="assets/images/back-arrow.png" alt="" />
        <span>{{ 'common.label.back' | transloco }}</span>
      </a>
    </div>

    <a
      class="title-link"
      href="https://www.ipedis.com"
      target="_blank"
      aria-label="Go to Ipedis Website- New window"
    >
      <img class="logo" src="assets/logo/logoIpedis.png" alt="Logo Ipedis" />
    </a>

    <ul class="lang-list">
      @for (lang of availableLangs; track lang) {
        <li>
          <button (click)="onChangeLang(lang)">{{ lang }}</button>
        </li>
      }
    </ul>
  </div>
</header>
