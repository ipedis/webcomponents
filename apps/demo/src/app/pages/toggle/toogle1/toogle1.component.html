<div class="modal-content">
  <div class="component-intro">
    <div class="title">
      <p>{{ 'common.components' | transloco }}</p>
      <h1>{{ 'toggle.title1' | transloco }}</h1>
    </div>
    <p>
      {{ 'toggle.intro1' | transloco }}
      {{ 'toggle.intro2' | transloco }}
    </p>
  </div>
  <app-accordion title="Demo" [alwaysOpen]="true">
    <div class="toggle" lang="en">
      <ip-toggle aria-label="Toggle notifications on or off" checked="true">
      </ip-toggle>

      <ip-toggle
        aria-label="Toggle notifications on or off"
        size="large"
        checked="false"
      >
      </ip-toggle>
    </div>
  </app-accordion>

  <app-accordion title="Code">
    <app-code-snippet [htmlCode]="toggleCode"> </app-code-snippet>
  </app-accordion>

  <app-accordion title="Documentation">
    <app-doc-toogle></app-doc-toogle>
  </app-accordion>
</div>
